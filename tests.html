<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ConCalc — тесты parser.js и группировки истории</title>
<style>
  body { font-family: consolas, monospace; margin: 20px; background: #fff; color: #000; }
  h1 { font-size: 18px; }
  #summary { font-size: 16px; font-weight: bold; margin: 10px 0; }
  .pass { color: #0a7d00; }
  .fail { color: #c00; }
  ul { list-style: none; padding: 0; }
  li { padding: 2px 0; white-space: pre-wrap; }
  .fail-detail { color: #c00; margin-left: 20px; font-size: 13px; }
</style>
</head>
<body>
<h1>ConCalc — тесты разбора строк (parser.js) и границ единиц отмены (history.js)</h1>
<div id="summary">Выполняется…</div>
<ul id="results"></ul>

<script src="vendor/math.min.js"></script>
<script src="parser.js"></script>
<!-- ui.js: на верхнем уровне только ссылки на DOM (editor, updateBtn —
     document.getElementById вернёт null вне приложения), проверяемые функции
     caretToLineCol/lineColToCaret их не трогают (issue #6). -->
<script src="ui.js"></script>
<!-- history.js: на верхнем уровне только объявления, DOM трогают лишь функции
     undo/redo/restoreState, которые здесь не вызываются. Проверяются чистые
     charClass и isEditGroupBoundary (issue #20). -->
<script src="history.js"></script>
<script>
// Простой раннер без зависимостей — соответствует ограничениям проекта
// (без сборки, без npm). Открывается тем же python3 -m http.server, что и
// само приложение.

const cases = [];

// t(описание, текст, options, ожидаемый_результат)
// ожидаемый_результат — строка (одна строка на входе) или массив строк.
function t(desc, text, options, expected) {
  cases.push({ desc, text, options: options || {}, expected: Array.isArray(expected) ? expected : [expected] });
}

// d(описание, полученное, ожидаемое) — проверка функции напрямую, минуя
// calculateText (для вспомогательных функций main.js и history.js).
function d(desc, actual, expected) {
  cases.push({ desc, text: '(прямой вызов)', options: {}, expected: [expected], directResult: [actual] });
}

// --- Дефект 1: заметки со знаком «=» не портятся ---
t('заметка «итог = ок» цела при наборе', 'итог = ок', {}, 'итог = ок');
t('заметка с пояснением цела при наборе', 'итого за март = 5', {}, 'итого за март = 5');
t('заметка цела при первом пересчёте (initial)', 'итог = ок', { initial: true }, 'итог = ок');

// --- Дефект 2: присваивание не теряет правую часть, общий scope ---
t('x = 5 не портится', 'x = 5', {}, 'x = 5');
t('переменная видна в следующей строке', 'x = 5\nx*2', {}, ['x = 5', 'x*2 → 10']);
t('переменная видна через несколько строк', 'x = 3\ny = 4\nx*x + y*y', {}, ['x = 3', 'y = 4', 'x*x + y*y → 25']);
t('scope не утекает между отдельными вызовами calculateText', 'x*2', {}, 'x*2');
t('a = выражение получает результат', 'a = 2+2', {}, 'a = 2+2 → 4');
t('f(x) = x^2 не вычисляется как выражение', 'f(x) = x^2', {}, 'f(x) = x^2');
t('объявленная функция доступна ниже', 'f(x) = x^2\nf(3)', {}, ['f(x) = x^2', 'f(3) → 9']);

// --- Дефект 3: запятая как разделитель аргументов/элементов ---
t('max(1,2) — два аргумента, не 1.2', 'max(1,2)', {}, 'max(1,2) → 2');
t('[1,2,3] разбирается как массив', '[1,2,3]', {}, '[1,2,3] → [1, 2, 3]');
t('запятая как десятичный разделитель', '1,5+2,5', {}, '1,5+2,5 → 4');
t('десятичная запятая в присваивании', 'x = 1,5\nx*2', {}, ['x = 1,5', 'x*2 → 3']);

// --- Дефект 4: пробелы не вырезаются, текстовые операторы работают ---
t('10 mod 3', '10 mod 3', {}, '10 mod 3 → 1');
t('5 inch to cm', '5 inch to cm', {}, '5 inch to cm → 12.7 cm');
t('true and false', 'true and false', {}, 'true and false → false');

// --- Базовый расчёт и формат чисел ---
t('простое выражение', '2+2', {}, '2+2 → 4');
t('без хвостовых нулей', '4/2', {}, '4/2 → 2');
t('дробный результат', '1/4', {}, '1/4 → 0.25');

// --- Сброс устаревшего результата при наборе (T-002, поведение при вводе) ---
t('устаревший числовой хвост сбрасывается при правке', '2+banana → 4', {}, '2+banana');
t('устаревший булев хвост сбрасывается при правке', '2+banana → true', {}, '2+banana');
t('устаревший отрицательный хвост сбрасывается при правке', '2+banana → -4', {}, '2+banana');

// --- Защита T-002: initial никогда не стирает существующий хвост ---
t('initial сохраняет сломанное выражение с хвостом', '2+banana → 4', { initial: true }, '2+banana → 4');
t('initial не путает валидный пересчёт со стиранием', '2+2 → 4', { initial: true }, '2+2 → 4');

// --- Свободный текст со стрелкой не трогается никогда (не только initial) ---
t('заметка со стрелкой цела при наборе', 'Москва → Питер', {}, 'Москва → Питер');
t('заметка со стрелкой цела при initial', 'Москва → Питер', { initial: true }, 'Москва → Питер');

// --- Идемпотентность ---
(function () {
  const text = '2+2\nx = 5\nx*2\nитог = ок\nf(x) = x^2\nf(3)\nmax(1,2)';
  const once = calculateText(text, {}).join('\n');
  // Уже вычисленный текст, разобранный ещё раз, не должен меняться.
  t('повторный разбор не меняет уже вычисленный текст', once, {}, once.split('\n'));
})();

// --- Миграция старого формата (« = ») на маркер (« → ») ---
t('вычисленная строка мигрирует', '2+2 = 4', { migrate: true }, '2+2 → 4');
t('заметка «итог = ок» не мигрирует', 'итог = ок', { migrate: true }, 'итог = ок');
t('заметка с пояснением не мигрирует', 'итого за март = 5', { migrate: true }, 'итого за март = 5');
t('присваивание x = 5 не мигрирует, но действует', 'x = 5\nx*2', { migrate: true }, ['x = 5', 'x*2 → 10']);
t('присваивание с запятой не мигрирует, но действует', 'x = 1,5\nx*2', { migrate: true }, ['x = 1,5', 'x*2 → 3']);
t('объявление функции не мигрирует, но действует', 'f(x) = x^2\nf(3)', { migrate: true }, ['f(x) = x^2', 'f(3) → 9']);
t('строка с маркером не трогается миграцией', '2+2 → 4', { migrate: true }, '2+2 → 4');
t('строка без « = » считается обычным выражением при migrate', '2+2', { migrate: true }, '2+2 → 4');
t('несовпадающий хвост не мигрирует (защита от порчи)', '2+2 = 5', { migrate: true }, '2+2 = 5');
t('повторное присваивание не мигрирует, даже когда переменная уже в scope', 'x = 5\nx = 5', { migrate: true }, ['x = 5', 'x = 5']);

// --- Пороги e-записи сдвинуты (issue #21): обычная запись до 10^10 и до 10^-7 ---
t('крупное целое не уходит в e-запись', '245432', {}, '245432 → 245432');
t('крупное целое после умножения', '245432*1000', {}, '245432*1000 → 245432000');
t('малая дробь не уходит в e-запись', '1/100000', {}, '1/100000 → 0.00001');
t('массив крупных чисел без e-записи', '[1,2,3]*100000', {}, '[1,2,3]*100000 → [100000, 200000, 300000]');
t('граница снизу: 10^-7 ещё не e-запись', '0.0000001', {}, '0.0000001 → 0.0000001');
t('за границей снизу: 10^-8 уже e-запись', '0.00000001', {}, '0.00000001 → 1e-8');
t('граница сверху: 9999999999 ещё не e-запись', '9999999999', {}, '9999999999 → 9999999999');
t('за границей сверху: 10^10 уже e-запись', '10000000000', {}, '10000000000 → 1e+10');
t('очень большое число всё ещё e-запись', '2^100', {}, '2^100 → 1.2676506e+30');
t('присваивание крупного числа не портится новыми порогами', 'x = 245432\nx*2', {}, ['x = 245432', 'x*2 → 490864']);

// --- Пустые и пробельные строки ---
t('пустая строка', '', {}, '');
t('пробельная строка', '   ', {}, '   ');
t('несколько пустых строк', '\n\n', {}, ['', '', '']);

// --- Вспомогательные функции, используемые в main.js ---
(function () {
  const okTail = resultTail('2+2 → 4') === '4';
  const okNoMarkerEq = resultTail('итог = ок') === null;
  const okNoMarkerAssign = resultTail('x = 5') === null;
  cases.push({
    desc: 'resultTail() достаёт хвост после маркера или null',
    text: '(вспомогательный тест, не через calculateText)',
    options: {},
    expected: [true, true, true],
    directResult: [okTail, okNoMarkerEq, okNoMarkerAssign]
  });
})();

// --- Пересчёт каретки при применении результатов (issue #6) ---
d('caretToLineCol: начало текста', caretToLineCol('ab\ncd', 0), { line: 0, col: 0 });
d('caretToLineCol: конец первой строки', caretToLineCol('ab\ncd', 2), { line: 0, col: 2 });
d('caretToLineCol: начало второй строки', caretToLineCol('ab\ncd', 3), { line: 1, col: 0 });
d('caretToLineCol: середина второй строки', caretToLineCol('ab\ncd', 4), { line: 1, col: 1 });
d('lineColToCaret: начало второй строки', lineColToCaret(['ab', 'cd'], 1, 0), 3);
d('lineColToCaret: строка выше выросла', lineColToCaret(['ab → 4', 'cd'], 1, 0), 7);
d('lineColToCaret: столбец больше длины строки', lineColToCaret(['ab', 'c'], 1, 5), 4);
d('lineColToCaret: номер строки за пределами', lineColToCaret(['ab'], 9, 0), 0);

// --- Границы единиц отмены (issue #20) ---
d('класс цифры — слово', charClass('5'), 'word');
d('класс латинской буквы — слово', charClass('x'), 'word');
d('класс кириллической буквы — слово', charClass('и'), 'word');
d('класс точки — слово (десятичная запись)', charClass('.'), 'word');
d('класс пробела', charClass(' '), 'space');
d('класс табуляции — пробел', charClass('\t'), 'space');
d('класс плюса — знак', charClass('+'), 'symbol');
d('класс скобки — знак', charClass('('), 'symbol');
d('класс запятой — знак', charClass(','), 'symbol');

// group: { op, cls, caret } — cls и caret описывают последний символ единицы
// и позицию каретки после него.
const gWord = { op: 'insert', cls: 'word', caret: 2 };

d('без открытой единицы — граница',
  isEditGroupBoundary(null, { op: 'insert', cls: 'word', caret: 0 }), true);
d('тот же класс вплотную — не граница',
  isEditGroupBoundary(gWord, { op: 'insert', cls: 'word', caret: 2 }), false);
d('смена класса (число → знак) — граница',
  isEditGroupBoundary(gWord, { op: 'insert', cls: 'symbol', caret: 2 }), true);
d('смена класса (знак → слово) — граница',
  isEditGroupBoundary({ op: 'insert', cls: 'symbol', caret: 3 }, { op: 'insert', cls: 'word', caret: 3 }), true);
d('прогон знаков подряд — одна единица',
  isEditGroupBoundary({ op: 'insert', cls: 'symbol', caret: 3 }, { op: 'insert', cls: 'symbol', caret: 3 }), false);
d('перенос каретки — граница',
  isEditGroupBoundary(gWord, { op: 'insert', cls: 'word', caret: 7 }), true);
d('переход набор → удаление — граница',
  isEditGroupBoundary(gWord, { op: 'deleteBack', cls: 'word', caret: 2 }), true);
d('удаление того же класса вплотную — не граница',
  isEditGroupBoundary({ op: 'deleteBack', cls: 'word', caret: 2 }, { op: 'deleteBack', cls: 'word', caret: 2 }), false);
d('смена направления удаления — граница',
  isEditGroupBoundary({ op: 'deleteBack', cls: 'word', caret: 2 }, { op: 'deleteForward', cls: 'word', caret: 2 }), true);
d('непосимвольная правка (вставка, IME) — граница',
  isEditGroupBoundary(gWord, { op: 'other', cls: null, caret: 2 }), true);

// --- Настройки формата (issue #10): decimals/grouping через options.format ---
// calculateText без options.format ведёт себя как раньше — умолчания диалога
// (decimals: 3 и т. п.) живут в config.js/settings.js, а не в parser.js.
t('без options.format вывод как раньше (не decimals: 3 из умолчаний диалога)', '1/3', {}, '1/3 → 0.3333333333');

t('decimals ограничивает знаки после запятой', '1/3', { format: { decimals: 3 } }, '1/3 → 0.333');
t('decimals — максимум, не фиксированная ширина (хвостовые нули не дописываются)', '1.5', { format: { decimals: 3 } }, '1.5 → 1.5');
t('decimals: 0 округляет до целого', '2/3', { format: { decimals: 0 } }, '2/3 → 1');
t('decimals не трогает e-запись снизу', '1e-9', { format: { decimals: 3 } }, '1e-9 → 1e-9');
t('decimals не трогает e-запись сверху', '2^100', { format: { decimals: 3 } }, '2^100 → 1.2676506e+30');
t('decimals не портит булев результат (round(true) не превращает в 1)', '2>1', { format: { decimals: 3 } }, '2>1 → true');
t('decimals не ломает Unit (math.round бросает на Unit)', '5.12345 inch to cm', { format: { decimals: 3 } }, '5.12345 inch to cm → 13.013563 cm');
t('decimals не трогает строковый результат', '"abc"', { format: { decimals: 3 } }, '"abc" → "abc"');
t('decimals применяется к массиву поэлементно', '[1/3, 2/3]', { format: { decimals: 3 } }, '[1/3, 2/3] → [0.333, 0.667]');
t('decimals: null — не ограничивать (полная точность)', '1/3', { format: { decimals: null } }, '1/3 → 0.3333333333');

t('grouping без явного groupSeparator откатывается на пробел', '1234567', { format: { grouping: true } }, '1234567 → 1 234 567');
t('grouping с явным разделителем — пробел', '1234567', { format: { grouping: true, groupSeparator: ' ' } }, '1234567 → 1 234 567');
t('grouping с апострофом', '1234567', { format: { grouping: true, groupSeparator: "'" } }, "1234567 → 1'234'567");
t('grouping сохраняет знак минуса и дробную часть без группировки', '-1234567.891', { format: { grouping: true, groupSeparator: ' ' } }, '-1234567.891 → -1 234 567.891');
t('grouping применяется к каждому элементу массива', '[1234567, 2]', { format: { grouping: true, groupSeparator: ' ' } }, '[1234567, 2] → [1 234 567, 2]');
t('grouping не трогает показатель e-записи', '2^100', { format: { grouping: true, groupSeparator: ' ' } }, '2^100 → 1.2676506e+30');
t('grouping и decimals вместе: сначала округление, потом разряды', '1234567.891', { format: { grouping: true, groupSeparator: ' ', decimals: 1 } }, '1234567.891 → 1 234 567.9');

t('isSuppressedAssignment не зависит от grouping — x = 245432 без маркера', 'x = 245432', { format: { grouping: true, groupSeparator: ' ' } }, 'x = 245432');
t('isSuppressedAssignment не зависит от decimals — x = 1.23456 без маркера', 'x = 1.23456', { format: { decimals: 3 } }, 'x = 1.23456');
t('присваивание с включёнными разрядами и decimals действует на следующую строку', 'x = 245432\nx*2', { format: { grouping: true, groupSeparator: ' ', decimals: 3 } }, ['x = 245432', 'x*2 → 490 864']);

t('миграция сравнивает по сырому формату, не по decimals/grouping', '2+2 = 4', { migrate: true, format: { grouping: true, groupSeparator: ' ', decimals: 3 } }, '2+2 → 4');

// --- Откат разделителей разрядов при разборе (issue #10): узкое правило,
// снятое в #1 сплошное вырезание пробелов не возвращается ---
t('пробел между цифрами снимается при неудачном разборе', '1 234 567', {}, '1 234 567 → 1234567');
t('апостроф между цифрами снимается', "1'234'567", {}, "1'234'567 → 1234567");
t('подчёркивание НЕ снимается — не разделитель разрядов, а не разбирается, строка остаётся нетронутой', '1_234_567', {}, '1_234_567');
t('разделители и десятичная запятая вместе', '1 234,5 + 1', {}, '1 234,5 + 1 → 1235.5');
t('10 mod 3 не задет откатом разделителей (нет цифра-разделитель-цифра)', '10 mod 3', {}, '10 mod 3 → 1');
t('5 inch to cm не задет откатом разделителей', '5 inch to cm', {}, '5 inch to cm → 12.7 cm');
t('max(1, 2) не задет откатом разделителей', 'max(1, 2)', {}, 'max(1, 2) → 2');
t('[1, 2, 3] не задет откатом разделителей', '[1, 2, 3]', {}, '[1, 2, 3] → [1, 2, 3]');

// --- groupDigits: прямой вызов чистой функции ---
d('groupDigits: целое число', groupDigits('1234567', ' '), '1 234 567');
d('groupDigits: отрицательное с дробной частью — дробь не группируется', groupDigits('-1234567.891', ' '), '-1 234 567.891');
d('groupDigits: массив', groupDigits('[1234567, 2]', ' '), '[1 234 567, 2]');
d('groupDigits: e-запись не трогается', groupDigits('1.2676506e+30', ' '), '1.2676506e+30');
d('groupDigits: число с единицей измерения', groupDigits('13013.5 cm', ' '), '13 013.5 cm');
d('groupDigits: короткое число без разрядов', groupDigits('123', ' '), '123');

// --- Раннер ---
let passed = 0;
let failed = 0;
const list = document.getElementById('results');

cases.forEach(function (c) {
  const actual = c.directResult || calculateText(c.text, c.options);
  const ok = JSON.stringify(actual) === JSON.stringify(c.expected);
  if (ok) passed++; else failed++;

  const li = document.createElement('li');
  li.className = ok ? 'pass' : 'fail';
  li.textContent = (ok ? '✓ ' : '✗ ') + c.desc;
  list.appendChild(li);

  if (!ok) {
    const detail = document.createElement('div');
    detail.className = 'fail-detail';
    detail.textContent = 'вход: ' + JSON.stringify(c.text) + ' options: ' + JSON.stringify(c.options) +
      ' | ожидалось: ' + JSON.stringify(c.expected) + ' | получено: ' + JSON.stringify(actual);
    list.appendChild(detail);
  }
});

const summary = document.getElementById('summary');
summary.textContent = passed + ' из ' + (passed + failed) + ' тестов пройдено';
summary.className = failed === 0 ? 'pass' : 'fail';
console.log(summary.textContent);
</script>
</body>
</html>
